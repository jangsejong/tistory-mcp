# CI — ruff(ubuntu) · pytest(ubuntu/macOS/Windows × Python 3.11~3.13) · 빌드한 wheel 스모크(ubuntu·windows)
# `@vN` 옆 주석은 작성 시점(2026-10-27)에 GitHub 릴리스로 확인한 정확한 버전.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: actions/setup-python@v7 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.2 # 메이저 태그(v10)가 없어 정확한 버전으로 고정
        with:
          enable-cache: false
      - name: Install dev extras (uv → setup-python 의 인터프리터)
        run: uv pip install --system -e ".[dev]"
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format --check
        run: ruff format --check src tests scripts

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: actions/setup-python@v7 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: pytest (네트워크 없음 — httpx.MockTransport)
        run: python -m pytest -q

  build-smoke:
    name: build + wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash # Windows 에서도 Git Bash — 아래 스크립트는 한 벌로 양쪽에서 동작
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: actions/setup-python@v7 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.2 # 메이저 태그(v10)가 없어 정확한 버전으로 고정
        with:
          enable-cache: false
      - name: uv build (sdist + wheel)
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: Install the wheel into a fresh venv → --version → MCP probe (11 tools, PROBE OK)
        run: |
          set -euo pipefail
          python -m venv smoke-venv
          if [ -x smoke-venv/Scripts/python.exe ]; then
            PY=smoke-venv/Scripts/python.exe
            BIN=smoke-venv/Scripts/tistory-mcp.exe
          else
            PY=smoke-venv/bin/python
            BIN=smoke-venv/bin/tistory-mcp
          fi
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet dist/*.whl
          "$BIN" --version
          python scripts/mcp_probe.py "$BIN" | tee probe.log
          grep -q "tools/list: 11 tools" probe.log
          grep -q "PROBE OK" probe.log
      - name: uvx --from wheel (사용자 설치 경로와 같은 방식)
        if: runner.os == 'Linux'
        run: uvx --from dist/*.whl tistory-mcp --version

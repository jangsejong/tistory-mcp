# Release — 태그 vX.Y.Z 푸시 → 버전 검사 + uv build → PyPI(trusted publishing) → MCP Registry → GitHub Release
#
# ■ 최초 1회 수동 설정 (관리자)
#   1) PyPI "pending" trusted publisher — https://pypi.org/manage/account/publishing/
#        PyPI project name : tistory-mcp
#        Owner             : jangsejong
#        Repository name   : tistory-mcp
#        Workflow filename : release.yml
#        Environment name  : pypi
#      프로젝트가 PyPI 에 아직 없으므로 "pending publisher" 로 등록한다. 첫 발행 때 일반 publisher 로 바뀐다.
#      토큰·시크릿은 필요 없다(OIDC). 다른 사람이 먼저 같은 이름을 등록하면 pending publisher 는 무효가 된다.
#   2) GitHub Environment `pypi` — Settings → Environments → New environment → 이름 `pypi`.
#      권장: Deployment branches and tags 를 `v*` 태그로 제한하고 required reviewer 를 1명 둔다.
#   3) MCP Registry — 별도 설정 없음(GitHub OIDC, `permissions.id-token: write`).
#      README 첫 줄 `<!-- mcp-name: io.github.jangsejong/tistory-mcp -->` 가 PyPI 패키지 설명에 들어가야
#      소유 검증을 통과한다(build 단계에서 확인). PyPI 반영 지연에 대비해 publish 는 60초 간격 5회 재시도.
#   4) 태그는 반드시 `v` + src/tistory_mcp/__init__.py 의 __version__ 이어야 하며 server.json 의
#      version / packages[0].version 도 같아야 한다 — 아니면 build 단계에서 실패(PyPI 발행 전).
#
# `@vN` 옆 주석은 작성 시점(2026-10-27)에 GitHub 릴리스로 확인한 정확한 버전.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: version check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2 # 메이저 태그(v10)가 없어 정확한 버전으로 고정
        with:
          enable-cache: false
      - name: Tag must equal v<__version__>; server.json / README must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/tistory_mcp/__init__.py)"
          SJ="$(python3 -c 'import json; d = json.load(open("server.json", encoding="utf-8")); print(d["version"], d["packages"][0]["version"], d["name"])')"
          PLUGIN="$(python3 -c 'import json; print(json.load(open("plugins/tistory/.claude-plugin/plugin.json", encoding="utf-8")).get("version", ""))')"
          echo "tag=${TAG} __version__=${PKG} server.json=(${SJ}) plugin.json=${PLUGIN}"
          if [ -z "${PKG}" ]; then
            echo "::error::__version__ not found in src/tistory_mcp/__init__.py"; exit 1
          fi
          if [ "${TAG}" != "v${PKG}" ]; then
            echo "::error::tag ${TAG} != v${PKG} (src/tistory_mcp/__init__.py)"; exit 1
          fi
          if [ "${SJ}" != "${PKG} ${PKG} io.github.jangsejong/tistory-mcp" ]; then
            echo "::error::server.json version/packages[0].version must be ${PKG} and name must be io.github.jangsejong/tistory-mcp"; exit 1
          fi
          if ! grep -qF -- '<!-- mcp-name: io.github.jangsejong/tistory-mcp -->' README.md; then
            echo "::error::README.md must contain '<!-- mcp-name: io.github.jangsejong/tistory-mcp -->' (PyPI ownership check)"; exit 1
          fi
          if [ "${PLUGIN}" != "${PKG}" ]; then
            echo "::warning::plugins/tistory/.claude-plugin/plugin.json version (${PLUGIN}) differs from ${PKG}"
          fi
      - name: uv build (sdist + wheel)
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tistory-mcp/
    permissions:
      id-token: write # trusted publishing 에 필수
    steps:
      - uses: actions/download-artifact@v8 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1 # 최신 릴리스 v1.14.3 (release/v1 브랜치)

  mcp-registry:
    name: publish to MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC 로그인
      contents: read
    env:
      # 공식 가이드(docs/modelcontextprotocol-io/github-actions.mdx)와 같은 방식으로 핀 + cosign 검증.
      # 올릴 때는 releases/latest 로 되돌리지 말고 의도한 릴리스 태그로 바꾼다.
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json (PyPI 반영 지연 대비 — 60초 간격 최대 5회)
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "attempt ${attempt} failed (PyPI may not have propagated yet); retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::mcp-publisher publish failed after 5 attempts"
          exit 1

  github-release:
    name: GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 생성
    steps:
      - uses: actions/download-artifact@v8 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*

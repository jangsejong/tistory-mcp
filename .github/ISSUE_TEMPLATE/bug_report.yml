name: 버그 신고
description: 도구가 오류를 내거나 예상과 다르게 동작합니다.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        신고 감사합니다. 작성 전에 한 가지만 확인해 주세요.

        **쿠키 값 · 세션 JSON(`~/.config/tistory-mcp/sessions/*.json`) · HAR 파일 · 쿠키가 보이는
        스크린샷은 절대 첨부하지 마세요.** 그 값은 블로그 관리 권한 그 자체입니다.
        블로그 주소를 공개하고 싶지 않으면 `myblog.tistory.com` 으로 바꿔 적어도 됩니다.
        잘 되던 도구가 갑자기 4xx/5xx 를 내면 「티스토리 변경으로 깨짐」 템플릿을 써 주세요.
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 실제로 일어난 일과 오류 메시지(있다면)를 적어 주세요.
      placeholder: "예: tistory_publish_post 를 호출하면 ToolError 가 나고 글이 만들어지지 않습니다."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 같은 일을 다시 일으키는 순서. 프롬프트나 도구 호출 인자를 쿠키 없이 적어 주세요.
      placeholder: |
        1. `claude mcp add tistory -- uvx tistory-mcp`
        2. "myblog.tistory.com 에 비공개로 글 올려줘"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 어떻게 동작했어야 한다고 생각하시나요?
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options:
        - Windows
        - Windows + WSL
        - macOS
        - Linux
        - 기타
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP 클라이언트
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - VS Code
        - 기타 (아래 로그 칸에 이름과 버전을 적어 주세요)
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python 버전
      description: "`python --version` 출력 (uvx 로 쓰면 `uvx tistory-mcp --version` 이 뜨는 환경의 버전)"
      placeholder: "Python 3.12.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tistory-mcp 버전
      description: "`tistory-mcp --version` 또는 `uvx tistory-mcp --version` 출력"
      placeholder: "tistory-mcp 0.2.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 / 오류 메시지
      description: |
        서버 로그(stderr)나 클라이언트의 MCP 로그. `TISTORY_MCP_LOG_LEVEL=DEBUG` 로 다시 실행하면
        더 자세히 나옵니다. 붙여 넣기 전에 `Cookie:` / `Set-Cookie:` 줄과 쿠키 값을 지워 주세요.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 쿠키·세션 파일·HAR를 첨부하지 않았습니다
          required: true
        - label: 최신 릴리스에서도 재현됩니다

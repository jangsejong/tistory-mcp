name: 티스토리 변경으로 깨짐
description: 잘 되던 도구가 티스토리 쪽 변경(내부 API·로그인 흐름) 때문에 깨진 것 같습니다.
title: "[티스토리 변경] "
labels: ["tistory-changed"]
body:
  - type: markdown
    attributes:
      value: |
        티스토리 내부 API 는 예고 없이 바뀝니다. 아래 정보가 있으면 `src/tistory_mcp/client.py` 를
        빨리 고칠 수 있습니다.

        **쿠키 값 · 세션 JSON · HAR · 로그인 URL 은 절대 첨부하지 마세요.** 응답 본문을 붙일 때도
        `Cookie:` / `Set-Cookie:` 줄과 토큰처럼 보이는 값은 지워 주세요. 블로그 주소는
        `myblog.tistory.com` 으로 바꿔 적어도 됩니다.
  - type: dropdown
    id: tool
    attributes:
      label: 깨진 도구
      options:
        - tistory_session_init
        - tistory_session_status
        - tistory_get_categories
        - tistory_list_posts
        - tistory_get_post
        - tistory_fetch_public_posts
        - tistory_publish_post
        - tistory_update_post
        - tistory_delete_post
        - tistory_upload_image
        - tistory_save_draft
        - CLI (tistory-mcp login / status / logout)
        - 여러 개 / 모름 (아래 응답 요지 칸에 적어 주세요)
    validations:
      required: true
  - type: input
    id: http-status
    attributes:
      label: HTTP 상태 코드
      description: 오류 메시지나 DEBUG 로그에 나온 상태 코드. 200 인데 로그인 페이지 HTML 이 온 경우도 적어 주세요.
      placeholder: "예: 403 / 500 / 200 (로그인 HTML)"
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: 언제부터
      description: 처음 깨진 날짜(YYYY-MM-DD). 마지막으로 잘 됐던 날짜도 알면 함께 적어 주세요.
      placeholder: "2026-10-27 부터 (10-25 까지는 정상)"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: 세션 상태
      description: "`tistory_session_status` 또는 `tistory-mcp status myblog.tistory.com` 의 결과"
      options:
        - valid — 세션은 살아 있는데 도구만 실패
        - invalid — 다시 로그인해도 같음
        - invalid — 다시 로그인하니 해결됨 (그래도 신고)
        - 모름
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: 응답 요지 (쿠키·토큰 제거)
      description: 응답 본문 앞부분(20줄 안팎)이나 오류 메시지. JSON 이면 키 이름이 특히 중요합니다.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 (선택)
      placeholder: 어떤 인자로 호출했는지, 브라우저의 티스토리 관리자 화면에서는 같은 동작이 되는지 등
  - type: input
    id: version
    attributes:
      label: tistory-mcp 버전
      description: "`tistory-mcp --version` 또는 `uvx tistory-mcp --version` 출력"
      placeholder: "tistory-mcp 0.2.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python 버전
      placeholder: "Python 3.12.3"
  - type: dropdown
    id: client
    attributes:
      label: MCP 클라이언트
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - VS Code
        - 기타 (재현 절차 칸에 이름과 버전을 적어 주세요)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options:
        - Windows
        - Windows + WSL
        - macOS
        - Linux
        - 기타
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 쿠키·세션 파일·HAR를 첨부하지 않았습니다
          required: true
        - label: 브라우저의 티스토리 관리자 화면에서는 같은 작업이 정상입니다
